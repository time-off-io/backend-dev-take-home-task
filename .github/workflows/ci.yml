name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B clean compile

      - name: Run unit and integration tests
        # `verify` runs unit tests (surefire) and integration tests with
        # Testcontainers/PostgreSQL (failsafe) in a single pass.
        run: ./mvnw -B verify

      - name: Package application JAR
        run: ./mvnw -B package -DskipTests

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: timeoff-assignment-jar
          path: target/timeoff-assignment.jar
          if-no-files-found: error
